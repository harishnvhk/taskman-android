name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          flutter create --org com.taskman --project-name taskman app
          cp lib/main.dart app/lib/main.dart
          mkdir -p app/android/app/src/main/kotlin/com/taskman/taskman
          cp MainActivity.kt app/android/app/src/main/kotlin/com/taskman/taskman/
          sed -i 's|<application|<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/><application|' app/android/app/src/main/AndroidManifest.xml
          cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: taskman-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }
